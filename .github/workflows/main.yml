name: Publish the main image

# Every push to master that passes the tests is published as the moving
# tag 'main', so that what master builds can be scanned for
# vulnerabilities before it is released: the scanner reads the
# revision label to tell a fix that is on master but not yet in a vX.Y.Z
# release. The image 'main' no longer points to is left untagged and is
# cleaned up afterwards.
on:
  workflow_run:
    workflows:
      - 'Test'
    types:
      - completed
    branches:
      - 'master'

permissions: {}

# A newer push replaces the run of an older one, so that 'main' is never
# moved back to an older commit.
concurrency:
  group: main-image
  cancel-in-progress: true

env:
  # The same platforms as the release (docker.yml).
  PLATFORMS: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/386,linux/ppc64le,linux/s390x

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      -
        name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Docker Buildx (push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    concurrency:
      group: cleanup-images
    steps:
      -
        # Deletes the untagged images only, each with its platform images
        # and attestations; a platform image of a tagged image is kept.
        name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          validate: true
