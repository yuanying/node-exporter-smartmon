name: Test

on:
  push:
    branches:
      - 'master'
  pull_request:

permissions: {}

jobs:
  release-script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Test the weekly release's decision
        run: .github/scripts/next-release_test.sh
