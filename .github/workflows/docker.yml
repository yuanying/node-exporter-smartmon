name: Publish Docker image

on:
  push:
    branches:
      - 'master'
      - 'v*'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'smartmon.sh'
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'smartmon.sh'
  # Called by the weekly release, which pushes its tag only after the
  # image is published: a tag pushed with GITHUB_TOKEN starts no workflow.
  workflow_call:
    inputs:
      tag:
        description: 'The vX.Y.Z tag the image is published as'
        required: true
        type: string

permissions: {}

env:
  PLATFORMS: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/386,linux/ppc64le,linux/s390x

jobs:
  build:
    if: inputs.tag == '' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Docker Buildx (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false

  publish:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Prepare
        id: prep
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          DOCKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY}
          VERSION=${TAG#v}
          SHORTREF=${GITHUB_SHA::8}
          TAGS="${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:${SHORTREF}"

          # If the VERSION looks like a version number, assume that
          # this is the most recent version of the image and also
          # tag it 'latest'.
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Docker Buildx (push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          # Read by the vulnerability scanner to find the source of the image
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
